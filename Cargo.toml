[workspace]
members = [
    "crates/tower-http-access-authorizers",
    "crates/http-request-matcher",
    "crates/user-password-auth",
    "crates/tower-http-access-core",
    "crates/tower-http-access-basic",
    "crates/tower-http-access-session",
    "crates/tower-http-access-form-login",
    "examples"
]

resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Jankbyte/tower-http-access"

[workspace.dependencies]
http-request-matcher = { version = "0.0.1", path = "crates/http-request-matcher" }
tower-http-access-core = { version = "0.0.1", path = "crates/tower-http-access-core" }
tower-http-access-authorizers = { version = "0.0.1", path = "crates/tower-http-access-authorizers" }
tower-http-access-basic = { version = "0.0.1", path = "crates/tower-http-access-basic" }
tower-http-access-form-login = { version = "0.0.1", path = "crates/tower-http-access-form-login" }
tower-http-access-session = { version = "0.0.1", path = "crates/tower-http-access-session" }
user-password-auth = { version = "0.0.1", path = "crates/user-password-auth" }

tower-sessions = { version = "0.15", default-features = false }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false }
matchit = "0.8.4"
mime = "0.3.17"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
http = "1.5.0"
password-hash = "0.6.1"
thiserror = "2.0.21"
tokio = "1"
tower = "0.5.3"
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.229"
serde_json = "1.0.154"
