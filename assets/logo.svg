      <stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.2" r="0.9">
      <stop stop-color="#252221"/>
      <stop offset="1" stop-color="#100e0d"/>
    </radialGradient>
  </defs>

