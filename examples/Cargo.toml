[package]
name = "tower-http-access-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
http-request-matcher = { path = "../crates/http-request-matcher" }
user-password-auth = { path = "../crates/user-password-auth", features = ["user_details"] }
tower-http-access-session = { path = "../crates/tower-http-access-session", features = ["browser_matcher", "session_matcher"] }
tower-sessions = { workspace = true, features = ["memory-store", "axum-core"] }
futures-util = { workspace = true, features = ["alloc"] }
tower = { workspace = true, features = ["util"] }
argon2.workspace = true
axum.workspace = true
tower-http-access-core = { path = "../crates/tower-http-access-core", features = ["filter_chain", "split_auth"] }
tower-http-access-basic = { path = "../crates/tower-http-access-basic", features = ["tracing"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["serde_derive"] }
