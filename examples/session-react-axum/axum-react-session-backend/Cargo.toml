[package]
name = "axum-react-session-backend"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
embedded-frontend = ["dep:include_dir", "dep:mime_guess"]

[dependencies]
http-request-matcher.workspace = true
tower-http-access-basic = { workspace = true, features = ["tracing"] }
tower-http-access-form-login = { workspace = true, features = ["tracing"] }
tower-http-access-core = { workspace = true, features = ["authorizers", "axum", "tracing", "filter_chain"] }
tower-http-access-authorizers = { workspace = true, features = ["authorities", "request_matcher"] }
tower-http-access-session = {workspace = true, features = ["form_login", "tower_sessions", "csrf", "tracing", "browser_matcher" ] }
user-password-auth = { workspace = true, features = ["tracing", "user_details", "serde"] }
tokio = { workspace = true, features = ["full"] }
argon2.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
tower-sessions = { workspace = true, features = ["memory-store"] }
tower.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
include_dir = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
