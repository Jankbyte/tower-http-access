[package]
name = "axum-basic-auth-crud"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tower-http-access-core = { workspace = true, features = ["authorizers", "axum"] }
tower-http-access-basic = { workspace = true, features = ["tracing"] }
user-password-auth = { workspace = true, features = ["tracing", "user_details"] }
tower-http-access-authorizers = { workspace = true, features = ["authorities", "request_matcher"] }

http.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace", "request-id"] }
tokio = { workspace = true, features = ["full"] }
password-hash.workspace = true
argon2.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing-subscriber.workspace = true
tracing.workspace = true
