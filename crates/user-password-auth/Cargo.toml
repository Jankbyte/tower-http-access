[package]
name = "user-password-auth"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Username/password authentication providers, user details, and password verification"
readme = "README.md"
keywords = ["authentication", "password", "credentials"]
categories = ["authentication"]

[dependencies]
futures-util = { workspace = true, features = ["alloc"] }
password-hash = { workspace = true, optional = true, features = ["getrandom", "phc"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
argon2.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
default = []
password = ["dep:password-hash", "dep:tokio", "dep:thiserror"]
user_details = ["password"]
serde = ["dep:serde", "user_details"]
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "simple_authenticator"

[[example]]
name = "password_hasher_verify"
required-features = ["password"]

[[example]]
name = "user_details_service"
required-features = ["user_details"]

[[example]]
name = "custom_user_detail_service"
required-features = ["user_details"]
