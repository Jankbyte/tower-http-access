[package]
name = "tower-http-access-basic"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP Basic authentication for Tower HTTP Access"
documentation = "https://docs.rs/tower-http-access-basic"
readme = "README.md"
keywords = ["authentication", "basic", "middleware", "tower"]
categories = ["authentication", "web-programming::http-server"]

[dependencies]
user-password-auth = { workspace = true }
tower-http-access-core = { workspace = true, default-features = false }
bytes.workspace = true
http.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
base64.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
tower-http-access-core = { workspace = true, features = ["axum", "request_matcher"] }
tower-http-access-authorizers = { workspace = true, features = ["request_matcher", "authorities"] }
http-request-matcher = { workspace = true }
user-password-auth = { workspace = true, features = ["user_details"] }
argon2.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
tracing = ["dep:tracing", "user-password-auth/tracing"]

[package.metadata.docs.rs]
all-features = true
