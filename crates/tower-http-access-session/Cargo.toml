[package]
name = "tower-http-access-session"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Session authentication for Tower HTTP Access using tower-sessions"
readme = "README.md"
keywords = ["authentication", "session", "middleware", "tower"]
categories = ["authentication", "web-programming::http-server"]

[dependencies]
tower-http-access-form-login = { workspace = true, optional = true }
http-request-matcher = { workspace = true, optional = true }
tower-http-access-core = { workspace = true, default-features = false }
tower-sessions = { workspace = true, optional = true }
http.workspace = true
serde.workspace = true
futures-util = { workspace = true, features = ["alloc"] }

[dev-dependencies]
user-password-auth.workspace = true
bytes.workspace = true
http-body-util.workspace = true
tower-layer.workspace = true
http-request-matcher = { workspace = true }
tower-http-access-authorizers = { workspace = true, features = ["request_matcher", "authorities"] }
tower-sessions = { workspace = true, features = ["memory-store", "axum-core"] }
tower-http-access-core = { workspace = true, features = ["axum"] }
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[features]
default = ["tower_sessions"]
tower_sessions = ["dep:tower-sessions"]
form_login = ["dep:tower-http-access-form-login"]
browser_matcher = ["dep:http-request-matcher", "session_matcher"]
session_matcher = ["dep:http-request-matcher"]

[package.metadata.docs.rs]
all-features = true
