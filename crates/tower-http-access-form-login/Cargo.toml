[package]
name = "tower-http-access-form-login"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Form login middleware for Tower HTTP Access"
readme = "README.md"
keywords = ["authentication", "form", "middleware", "tower"]
categories = ["authentication", "web-programming::http-server"]

[dependencies]
http-request-matcher.workspace = true
user-password-auth.workspace = true
tower-http-access-core = { workspace = true, default-features = false }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
serde_urlencoded = "0.7"
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
