[package]
name = "axum-auth-chained"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Composable authentication and authorization middleware for Axum"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/axum-auth-chained"
readme = "README.md"
keywords = ["axum", "authentication", "authorization", "middleware", "tower"]
categories = ["authentication", "web-programming::http-server"]

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, default-features = false, features = ["alloc"] }
matchit = { workspace = true, optional = true }
http.workspace = true
tower-service.workspace = true
tower-layer.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"] }
password-hash = { workspace = true, features = ["getrandom", "phc"], optional = true }
argon2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["full"] }

[features]
default = ["axum"]
axum = ["dep:axum"]
tracing = ["dep:tracing"]
argon2_encoder = ["basic_auth", "dep:argon2"]
request_matcher = ["dep:matchit"]
basic_auth = ["request_matcher", "dep:base64", "dep:password-hash"]

[package.metadata.docs.rs]
all-features = true
