[package]
name = "tower-http-access-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Composable HTTP authentication and authorization middleware for Tower and Axum"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tower-http-access-core"
readme = "README.md"
keywords = ["axum", "authentication", "authorization", "middleware", "tower"]
categories = ["authentication", "web-programming::http-server"]

[dependencies]
user-password-auth = { version = "0.0.1", path = "../user-password-auth", optional = true }
bytes.workspace = true
futures-util = { workspace = true, default-features = false, features = ["alloc"] }
http-request-matcher = { version = "0.0.1", path = "../http-request-matcher", optional = true }
http.workspace = true
tower-service.workspace = true
tower-layer.workspace = true
tower = { workspace = true, features = ["util"], optional = true }
thiserror.workspace = true
axum = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["full"] }

[features]
user_password_auth = ["dep:user-password-auth", "user-password-auth/user_details"]
default = ["axum"]
axum = ["dep:axum"]
request_matcher = ["dep:http-request-matcher"]
filter_chain = ["request_matcher", "dep:tower"]
split_auth = []

[package.metadata.docs.rs]
all-features = true
